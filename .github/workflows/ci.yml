name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DRP2040_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure
